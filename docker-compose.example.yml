services:
  flashcards:
    image: ghcr.io/toxaris-nl/flashcards:latest
    container_name: flashcards
    restart: unless-stopped
    volumes:
      - ${FLASHCARDS_CONFIG_DIR:-./config/flashcards}:/etc/flashcards
      - ${FLASHCARDS_DATA_DIR:-./data/flashcards}:/data
    environment:
      FLASHCARDS_CONFIG: /etc/flashcards/flashcards.toml
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    ports:
      - "9990:8080"
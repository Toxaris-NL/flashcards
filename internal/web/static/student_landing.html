<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-border: #dfe7f2;
        --primary: #2d5b8f;
        --primary-dark: #214775;
        --text: #1d2a36;
        --muted: #5c6978;
        --success: #186b4a;
        --alert: #a13a3a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      main {
        width: min(460px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(28, 46, 63, 0.08);
        padding: clamp(1.25rem, 4vw, 2rem) clamp(1rem, 4vw, 1.5rem);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 2.6rem);
        text-align: center;
        color: var(--primary-dark);
      }
      .eyebrow {
        margin: 0 0 1.25rem;
        text-align: center;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .message {
        padding: 0.75rem 0.9rem;
        border-radius: 10px;
        margin-bottom: 1rem;
        font-size: 0.96rem;
      }
      .message.alert {
        background: #fff1f1;
        border: 1px solid #f2c7c7;
        color: var(--alert);
      }
      .message.success {
        background: #edf9f3;
        border: 1px solid #c9ebd8;
        color: var(--success);
      }
      nav {
        display: grid;
        gap: 0.8rem;
        margin-top: 1rem;
      }
      a.button {
        display: block;
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        text-decoration: none;
        text-align: center;
        font-weight: 700;
        background: var(--primary);
        color: #fff;
        transition: background 0.2s ease;
      }
      a.button:hover {
        background: var(--primary-dark);
      }
      a.button.secondary {
        background: #edf3fb;
        color: var(--primary-dark);
      }
      @media (max-width: 480px) {
        main {
          border-radius: 14px;
          padding: 1.1rem 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Studieportaal</div>
      <h1>Flashcards</h1>
      {{if .Error}}<p class="message alert" role="alert">{{.Error}}</p>{{end}}
      {{if .Success}}<p class="message success" role="status">{{.Success}}</p>{{end}}
      <nav>
        <a class="button" href="/student/login">Aanmelden</a>
        <a class="button secondary" href="/student/signup">Nieuw account</a>
      </nav>
    </main>
  </body>
</html>

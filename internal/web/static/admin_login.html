<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{index .Labels "admin"}}</title>
    <style>
      :root {
        --primary: #1f6feb;
        --primary-dark: #143d7a;
        --surface: #ffffff;
        --surface-alt: #eef4ff;
        --text: #1b2430;
        --muted: #5a6475;
        --danger: #b42318;
        --success: #067647;
        --border: #dfe7f5;
        --shadow: 0 18px 40px rgba(28, 52, 88, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #edf5ff 0%, #f5f8ff 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 2rem 1.4rem;
      }
      .eyebrow {
        color: var(--primary);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 2.5rem);
        line-height: 1.1;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        font-weight: 600;
        color: var(--text);
      }
      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.8rem 0.9rem;
        font-size: 1rem;
        color: var(--text);
        background: #fdfdff;
      }
      input:focus {
        outline: 2px solid rgba(31, 111, 235, 0.18);
        border-color: var(--primary);
      }
      button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.9rem 1rem;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.96; }
      .message {
        margin: 0 0 1rem;
        padding: 0.75rem 0.9rem;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .message.alert {
        background: #fef3f2;
        color: var(--danger);
        border: 1px solid #f7c5bf;
      }
      .meta {
        margin-top: 1rem;
        display: flex;
        justify-content: center;
      }
      .meta a {
        color: var(--primary-dark);
        font-weight: 600;
        text-decoration: none;
      }
      .meta a:hover { text-decoration: underline; }
      @media (max-width: 480px) {
        main {
          border-radius: 14px;
          padding: 1.1rem 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Beheer</div>
      <h1>Beheer inloggen</h1>
      {{if .Error}}<p class="message alert" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/admin/login">
        <label>{{index .Labels "username"}} <input name="username" required></label>
        <label>{{index .Labels "password"}} <input name="password" type="password" required></label>
        <button type="submit">{{index .Labels "login"}}</button>
      </form>
      <div class="meta">
        <a href="/">Terug naar start</a>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nieuw account</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-border: #dfe7f2;
        --primary: #2d5b8f;
        --primary-dark: #214775;
        --text: #1d2a36;
        --muted: #5c6978;
        --alert: #a13a3a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      main {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(28, 46, 63, 0.08);
        padding: clamp(1.25rem, 4vw, 2rem) clamp(1rem, 4vw, 1.5rem);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.8rem, 5.5vw, 2.2rem);
        text-align: center;
        color: var(--primary-dark);
      }
      .message {
        padding: 0.75rem 0.9rem;
        border-radius: 10px;
        margin-bottom: 1rem;
        font-size: 0.96rem;
      }
      .message.alert {
        background: #fff1f1;
        border: 1px solid #f2c7c7;
        color: var(--alert);
      }
      .message.success {
        background: #edf9f3;
        border: 1px solid #c9ebd8;
        color: #186b4a;
      }
      form {
        display: grid;
        gap: 1rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.8rem 0.9rem;
        border: 1px solid #cbd8ea;
        border-radius: 10px;
        font: inherit;
        min-height: 48px;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 0.9rem 1rem;
        background: var(--primary);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        min-height: 48px;
      }
      button:hover { background: var(--primary-dark); }
      .meta {
        margin-top: 1rem;
        display: grid;
        gap: 0.5rem;
        text-align: center;
      }
      a {
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { text-decoration: underline; }
      @media (max-width: 480px) {
        main {
          border-radius: 14px;
          padding: 1.1rem 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nieuw account</h1>
      {{if .Error}}<p class="message alert" role="alert">{{.Error}}</p>{{end}}
      {{if .Success}}<p class="message success" role="status">{{.Success}}</p>{{end}}
      <form method="post" action="/student/signup">
        <label>Gebruikersnaam <input name="username" required></label>
        <label>Pincode <input name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" required></label>
        <button type="submit">Account aanvragen</button>
      </form>
      <div class="meta">
        <a href="/student/login">Ja, ik heb al een account</a>
        <a href="/">Terug naar start</a>
      </div>
    </main>
  </body>
</html>

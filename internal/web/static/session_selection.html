<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serie kiezen</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-border: #dfe7f2;
        --primary: #2d5b8f;
        --primary-dark: #214775;
        --text: #1d2a36;
        --muted: #5c6978;
        --success: #186b4a;
        --alert: #a13a3a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      main {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(28, 46, 63, 0.08);
        padding: clamp(1.25rem, 4vw, 2rem) clamp(1rem, 4vw, 1.5rem);
      }
      .eyebrow {
        margin: 0 0 0.5rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.8rem, 5.5vw, 2.4rem);
        color: var(--primary-dark);
      }
      form {
        display: grid;
        gap: 1rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-weight: 600;
      }
      select {
        width: 100%;
        padding: 0.8rem 0.9rem;
        border: 1px solid #cbd8ea;
        border-radius: 10px;
        font: inherit;
        background: white;
        min-height: 48px;
      }
      fieldset { border: 0; margin: 0; padding: 0; }
      legend { margin-bottom: 0.5rem; font-weight: 600; }
      .mode-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
      .mode-option { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; border: 1px solid #cbd8ea; border-radius: 10px; background: white; }
      .mode-option input { width: auto; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      button, a.button {
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0.9rem 1rem;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        min-height: 48px;
      }
      button {
        background: var(--primary);
        color: white;
      }
      button:hover { background: var(--primary-dark); }
      a.button {
        background: #edf3fb;
        color: var(--primary-dark);
      }
      @media (max-width: 480px) {
        main { border-radius: 14px; }
        .actions { flex-direction: column; }
        button, a.button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Studieportaal</div>
      <h1>Serie kiezen</h1>
      <form method="post" action="/student/sessions/select">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label>Vak
          <select name="subject">
            {{range .References}}
            <option value="{{.Subject}}" {{if and (eq .Subject $.Selected.Subject) (eq .Period $.Selected.Period)}}selected{{end}}>{{.Subject}}</option>
            {{end}}
          </select>
        </label>
        <label>Periode
          <select name="period">
            {{range .References}}
            <option value="{{.Period}}" {{if and (eq .Subject $.Selected.Subject) (eq .Period $.Selected.Period)}}selected{{end}}>{{.Period}}</option>
            {{end}}
          </select>
        </label>
        <fieldset>
          <legend>Oefenvorm</legend>
          <div class="mode-options">
            <label class="mode-option"><input type="radio" name="mode" value="mixed" checked>Gemengd</label>
            <label class="mode-option"><input type="radio" name="mode" value="typed">Alleen typen</label>
          </div>
        </fieldset>
        <label>Tempo voor gemengd oefenen
          <select name="difficulty">
            <option value="easy">Makkelijk</option>
            <option value="ok" selected>Normaal</option>
            <option value="hard">Moeilijk</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit">Starten</button>
          <a class="button" data-edit-list href="/student/topics/edit?subject={{.Selected.Subject}}&amp;period={{.Selected.Period}}">Serie bewerken of CSV importeren</a>
          <a class="button" href="/student/topics/new">Flashcard-editor openen</a>
        </div>
      </form>
    </main>
    <script src="/static/session-selection.js"></script>
  </body>
</html>

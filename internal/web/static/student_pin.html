<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pincode wijzigen</title>
    <style>
      :root { --panel: #ffffff; --border: #dfe7f2; --primary: #2d5b8f; --primary-dark: #214775; --text: #1d2a36; --alert: #a13a3a; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1rem; background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
      main { width: min(420px, 100%); padding: 1.5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 18px 40px rgba(28, 46, 63, 0.08); }
      h1 { margin-top: 0; color: var(--primary-dark); }
      form { display: grid; gap: 1rem; }
      label { display: grid; gap: 0.35rem; font-weight: 700; }
      input { width: 100%; min-height: 48px; padding: 0.8rem; border: 1px solid #cbd8ea; border-radius: 10px; font: inherit; }
      button { min-height: 48px; border: 0; border-radius: 10px; background: var(--primary); color: white; font: inherit; font-weight: 700; cursor: pointer; }
      .message { padding: 0.75rem; border: 1px solid #f2c7c7; border-radius: 10px; color: var(--alert); background: #fff1f1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pincode wijzigen</h1>
      {{if .Error}}<p class="message" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/student/pin">
        <label>Tijdelijke pincode <input name="temporary_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" required></label>
        <label>Nieuwe pincode <input name="new_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" required></label>
        <button type="submit">Pincode opslaan</button>
      </form>
    </main>
  </body>
</html>
